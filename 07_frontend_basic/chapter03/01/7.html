<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .box {
            display: grid;
            background: #ccc;
            grid-template-columns: repeat(3, 1fr);
            width: 600px;
            padding: 30px;
            gap: 15px;
        }

        .area {
            background: skyblue;
            height: 100px;
        }

        .area:nth-of-type(1) {
            grid-column: span 2;
        }

        .area:nth-of-type(2) {
            grid-row: span 2;
            height: 215px;
        }
    </style>
    <div class="box">
        <div class="area">영역1</div>
        <div class="area">영역2</div>
        <div class="area">영역3</div>
        <div class="area">영역4</div>
    </div>
</body>
</html>
