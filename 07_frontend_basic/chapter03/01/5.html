<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
            flex-wrap: wrap;
        }

        li {
            /* min-width: 100px; */
            /* width: 0; */
            flex-basis: 200px;
            flex-shrink: 0;
        }

        li:nth-of-type(3n+1) {
            background: red;
        }

        li:nth-of-type(3n+2) {
            background: blue;
        }

        li:nth-of-type(3n) {
            background: green;
        }

        .flex1 {
            display: flex;
        }

    
    </style>

</body>
