<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        window.addEventListener("DOMContentLoaded", function() {
            const divEl = document.querySelector("div");

        });
    </script>

    <div>
        <span>클릭</span>
    </div>
